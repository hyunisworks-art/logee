    { value: 0, label: "シャープすべて" },
    { value: 1, label: "#まで" },
    { value: 2, label: "##まで" },
    { value: 3, label: "###まで" },
    { value: 4, label: "####まで" },
    { value: 5, label: "#####まで" },
  ];
  function doExportMd() {
    commitCurrentEdit();
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    const optionsHtml = MD_HEADING_OPTIONS.map(o =>
      `<label style="display:flex;align-items:center;gap:4px;">
         <input type="radio" name="mdHeadingLimit" value="${o.value}" ${settings.mdHeadingLimit === o.value ? "checked" : ""}>
         ${o.label}
       </label>`).join("");
    overlay.innerHTML = `
      <div class="modal">
        <h2>Markdown出力</h2>
        <div class="settings-section">
          <div class="settings-label">見出し階層</div>
          <div style="display:flex;gap:12px;flex-wrap:wrap;">${optionsHtml}</div>
        </div>
        <textarea readonly></textarea>
        <div class="modal-actions">
          <button id="mdCopy">コピー</button>
          <button id="mdDownload">ダウンロード(.md)</button>
          <button id="mdClose">閉じる</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const textarea = overlay.querySelector("textarea");
    function refresh() {
      textarea.value = buildMarkdown(tree, 0, settings.mdHeadingLimit).trimEnd() + "\n";
    }
    refresh();
    overlay.querySelectorAll('input[name="mdHeadingLimit"]').forEach(input => {
      input.addEventListener("change", () => {
        settings.mdHeadingLimit = parseInt(input.value, 10);
        saveSettings();
        refresh();
      });
    });
    overlay.querySelector("#mdCopy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(textarea.value); overlay.querySelector("#mdCopy").textContent = "コピーしました"; }
      catch (e) { textarea.select(); document.execCommand("copy"); }
    });
    overlay.querySelector("#mdDownload").addEventListener("click", () => {
      const blob = new Blob([textarea.value], { type: "text/markdown" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url; a.download = "logic-tree-" + new Date().toISOString().slice(0, 10) + ".md";
      a.click(); URL.revokeObjectURL(url);
    });
    const close = () => overlay.remove();
    overlay.querySelector("#mdClose").addEventListener("click", close);
    overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  }

  // ---- Markdown import ----
  function parseMdToTree(md) {
    nextId = 1;
    const root  = newNode("");
    const stack = [{ node: root, depth: 0 }];
    let last = root;
    for (const raw of md.split("\n")) {
      const line = raw.trimEnd();
      const m    = line.match(/^(#{1,6})\s+(.*)/);
      if (m) {
        const depth = m[1].length;
        const text  = m[2].trim();
        const n     = newNode(text);
        while (stack.length > 1 && stack[stack.length - 1].depth >= depth) stack.pop();
        stack[stack.length - 1].node.children.push(n);
        stack.push({ node: n, depth });
        last = n;
      } else if (line.trim()) {
        last.text = last.text ? last.text + "\n" + line.trim() : line.trim();
      }
    }
    // "#" が単一の最上位見出しの場合、空のダミールートではなくその見出し自体をルートにする
    if (root.text === "" && root.children.length === 1) return root.children[0];
    return root;
  }
  document.getElementById("btnImportMd").addEventListener("click", () => {
    document.getElementById("mdFileInput").click();
  });
  document.getElementById("mdFileInput").addEventListener("change", (e) => {
    const file = e.target.files[0]; if (!file) return; e.target.value = "";
    if (!file.name.toLowerCase().endsWith(".md")) { alert(".md ファイルのみ読み込めます"); return; }
    const reader = new FileReader();
    reader.onload = ev => {
      pushUndo();
      tree = parseMdToTree(ev.target.result);
      selectedId = null; editingId = null; activeQuill = null;
      save(); render();
    };
    reader.readAsText(file, "UTF-8");
  });
  async function importFromClipboard() {
    let text;
    try { text = await navigator.clipboard.readText(); }
    catch (e) { alert("クリップボードを読み取れませんでした。ブラウザの権限を確認してください。"); return; }
    if (!text || !text.trim()) { alert("クリップボードにテキストがありません"); return; }
    pushUndo();
    tree = parseMdToTree(text);
    selectedId = null; editingId = null; activeQuill = null;
    save(); render();
  }
  document.getElementById("btnImportClipboard").addEventListener("click", importFromClipboard);

  // ---- Toolbar ----
  function setCollapsedAll(node, v) {
    if (node.children.length > 0) node.collapsed = v;
    node.children.forEach(c => setCollapsedAll(c, v));
  }
  document.getElementById("btnExpandAll").addEventListener("click",   () => { setCollapsedAll(tree, false); save(); render(); });
  document.getElementById("btnCollapseAll").addEventListener("click", () => { setCollapsedAll(tree, true);  save(); render(); });
  document.getElementById("btnReset").addEventListener("click", () => {
    if (!confirm("このツリーの内容をすべて消去しますか？")) return;
    pushUndo();
    tree = defaultTree(); selectedId = null; editingId = null; activeQuill = null;
    save(); render();
  });
  document.getElementById("btnUndo").addEventListener("click", undo);
  document.getElementById("btnExportMd").addEventListener("click", doExportMd);
  document.getElementById("btnSettings").addEventListener("click", openSettingsModal);
  document.getElementById("btnNewTree").addEventListener("click", addTree);
  document.getElementById("btnToggleList").addEventListener("click", () => {
    settings.sidebar = !settings.sidebar;
    saveSettings();
    applySidebar();
    relayoutConnectors(); // 表示幅が変わるので接続線を引き直す
  });

  // ---- Settings modal ----
  function openSettingsModal() {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    const rows = Object.entries(ACTION_LABELS).map(([key, label]) =>
      `<tr><td class="sc-label">${label}</td><td>
        <input class="sc-input" data-action="${key}" readonly value="${settings.shortcuts[key] || ""}">
       </td></tr>`).join("");

    overlay.innerHTML = `
      <div class="modal">
        <h2>設定</h2>
        <div class="settings-section">
          <div class="settings-label">インデント幅</div>
          <div style="display:flex;align-items:center;gap:8px;">
            <input type="number" id="stgIndent" min="10" max="120" step="4" value="${settings.indent}" class="num-input">
            <span class="hint-text">px</span>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-label">設定ファイル</div>
          <div class="hint-text" style="margin-bottom:6px;">
            テーマ単体（.logee-theme.json）と統合設定（.logee-config.json）のどちらも読込できます。
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button id="stgConfigImport">読込</button>
            <button id="stgThemeExport">テーマのみ書出</button>
            <button id="stgConfigExport">統合設定を書出</button>
            <button id="stgSettingsReset">設定をデフォルトに戻す</button>
          </div>
          <input type="file" id="configFileInput" accept=".json" style="display:none">
        </div>
        <div class="settings-section">
          <div class="settings-label">MOD（コード入り・上級者向け）</div>
          <div class="hint-text" style="margin-bottom:6px;">
            パネルの配置計算をJavaScriptで差し替える <code>.logee-mod.json</code> を読み込みます。
            標準の設定ファイルとは別の読込口です。読み込んだMODは再読み込みで解除されます。
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button id="stgModImport">MODを読込</button>
            <button id="stgModDisable">MODを解除</button>
          </div>
          <input type="file" id="modFileInput" accept=".json" style="display:none">
        </div>
        <div class="settings-section">
          <div class="settings-label">ショートカットキー</div>
          <div class="hint-text" style="margin-bottom:6px;">入力欄をクリック後、新しいキーを押して設定。Esc でキャンセル。</div>
          <table class="sc-table">${rows}</table>
        </div>
        <div class="modal-actions"><button id="stgClose" class="primary">閉じる</button></div>
      </div>`;

    document.body.appendChild(overlay);

    overlay.querySelector("#stgIndent").addEventListener("input", function () {
      const v = Math.max(10, Math.min(120, parseInt(this.value, 10) || 28));
      settings.indent = v; saveSettings();
      document.documentElement.style.setProperty("--indent", v + "px");
      relayoutConnectors();
    });

    const configFile = overlay.querySelector("#configFileInput");
    overlay.querySelector("#stgConfigImport").addEventListener("click", () => configFile.click());
    configFile.addEventListener("change", (e) => {
      const file = e.target.files[0]; if (!file) return; e.target.value = "";
      const reader = new FileReader();
      reader.onload = ev => {
        try { importConfig(JSON.parse(ev.target.result)); }
        catch (_) { alert("JSON の読み込みに失敗しました"); }
      };
      reader.readAsText(file, "UTF-8");
    });

    // MODは標準設定とは別の読込口にする（境界を明確にするため入口を分ける）
    const modFile = overlay.querySelector("#modFileInput");
    overlay.querySelector("#stgModImport").addEventListener("click", () => modFile.click());
    modFile.addEventListener("change", (e) => {
      const file = e.target.files[0]; if (!file) return; e.target.value = "";
      const reader = new FileReader();
      reader.onload = ev => {
        let data;
        try { data = JSON.parse(ev.target.result); }
        catch (_) { alert("JSON の読み込みに失敗しました"); return; }
        if (!data || data.type !== "logee-mod") {
          alert('この読込口は MOD 専用です（type: "logee-mod"）。\n通常の設定ファイルは「設定ファイル」の読込を使ってください。');
          return;
        }
        close();
        importMod(data);
      };
      reader.readAsText(file, "UTF-8");
    });
    overlay.querySelector("#stgModDisable").addEventListener("click", () => {
      if (!modState) { alert("MODは読み込まれていません"); return; }
      close();
      disableMod(null);
    });

    overlay.querySelector("#stgThemeExport").addEventListener("click", () => {
      const data = { type: "theme", name: "Custom Theme", version: "1.0.0", colors: collectCurrentThemeColors() };
      downloadJson(data, "logee-theme.json");
    });

    overlay.querySelector("#stgConfigExport").addEventListener("click", () => {
      const data = {
        type: "logee-config",
        name: "Custom Config",
        version: "1.0.0",
        theme:    { colors: collectCurrentThemeColors() },
        keybinds: Object.assign({}, settings.shortcuts),
        template: { layout: activeLayout, connector: activeConnector, params: settings.layoutParams || {} },
      };
      downloadJson(data, "logee-config.json");
    });

    overlay.querySelector("#stgSettingsReset").addEventListener("click", () => {
      if (!confirm("テーマ・レイアウト・インデント幅・ショートカットを初期状態に戻します。\nツリーの内容は消えません。よろしいですか？")) return;
      localStorage.removeItem(THEME_KEY);
      CSS_VARS.forEach(v => document.documentElement.style.removeProperty("--" + v));
      settings.indent = 28;
      settings.layout = "tree";
      settings.connector = "straight";
      settings.layoutParams = {};
      settings.mdHeadingLimit = 0;
      settings.shortcuts = Object.assign({}, DEFAULT_SHORTCUTS);
      saveSettings();
      document.documentElement.style.setProperty("--indent", settings.indent + "px");
      teardownMod();
      activeLayout = resolveLayout(settings.layout);
      activeConnector = resolveConnector(settings.connector);
      refreshModBadge();
      close();
      render();
      openSettingsModal(); // 入力欄の表示を初期値に更新するため開き直す
    });

    let capturing = null;
    overlay.querySelectorAll(".sc-input").forEach(input => {
      input.addEventListener("click", () => {
        if (capturing) capturing.style.outline = "";
        capturing = input;
        input.style.outline = "2px solid var(--accent)";
        input.value = "キーを押してください…";
      });
      input.addEventListener("keydown", (e) => {
        if (capturing !== input) return;
        e.preventDefault(); e.stopPropagation();
        if (e.key === "Escape") {
          input.value = settings.shortcuts[input.dataset.action] || "";
          input.style.outline = ""; capturing = null; return;
        }
        const sc = normalizeKey(e);
        if (!sc) return;
        settings.shortcuts[input.dataset.action] = sc;
        saveSettings();
        input.value = sc;
        input.style.outline = ""; capturing = null;
      });
    });

    const close = () => overlay.remove();
    overlay.querySelector("#stgClose").addEventListener("click", close);
    overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  }

  // ---- Canvas pan（空白部分をドラッグしてキャンバス全体を移動） ----
  // ノードのDnD（bindDragHandle）と同じ「移動量が閾値を超えるまではドラッグ開始としない」方式。
  // 閾値未満のままmouseupした場合はクリック（＝下の deselect ハンドラ）として扱う。
  let justPanned = false;
  document.getElementById("canvas").addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;
    if (e.target.closest(".node-box") || e.target.closest("button")) return;
    const canvas = document.getElementById("canvas");
    const startX = e.clientX, startY = e.clientY;
    const startScrollLeft = canvas.scrollLeft, startScrollTop = canvas.scrollTop;
    let started = false;

    const onMove = (moveEvt) => {
      // ウィンドウ外でボタンを離すとmouseupを取りこぼすことがあるため、
      // 移動のたびに左ボタンが実際に押されているかを確認し、離れていれば即座に終了する。
      if ((moveEvt.buttons & 1) === 0) { onUp(); return; }
      const dx = moveEvt.clientX - startX;
      const dy = moveEvt.clientY - startY;
      if (!started) {
        if (Math.hypot(dx, dy) < DRAG_START_THRESHOLD) return;
        started = true;
        canvas.classList.add("panning");
      }
      moveEvt.preventDefault();
      canvas.scrollLeft = startScrollLeft - dx;
      canvas.scrollTop  = startScrollTop - dy;
    };
    const onUp = () => {
      canvas.classList.remove("panning");
      if (started) justPanned = true; // 直後に発火するclickでの選択解除を抑止する
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      window.removeEventListener("blur", onUp);
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
    window.addEventListener("blur", onUp); // Alt+Tab等でウィンドウがフォーカスを失った場合の保険
  });

  // ---- Canvas deselect ----
  document.getElementById("canvas").addEventListener("click", (e) => {
    if (justPanned) { justPanned = false; return; } // ドラッグでパンした直後のclickは選択解除しない
    // .node-box の外側（接続線・余白など）をクリックしたら選択解除する
    if (!e.target.closest(".node-box")) { commitCurrentEdit(); selectedId = null; editingId = null; render(); }
  });
  window.addEventListener("resize", relayoutConnectors);

  // ---- Init ----
  document.documentElement.style.setProperty("--indent", settings.indent + "px");
  applyZoom();
  applySidebar();
  refreshModBadge();
  renderTreeList();
  writeStore(); // v1→v2 移行直後でも、この時点で v2 を確定させておく
  render();

})();
</script>
